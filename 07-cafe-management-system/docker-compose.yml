version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CafeSecure123!}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_db}
    ports:
      - "5437:5432"
    volumes:
      - cafe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_admin} -d ${POSTGRES_DB:-cafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cafe_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe_backend
    restart: always
    ports:
      - "5007:5000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CafeSecure123!}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cafe_db}
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cafe_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe_frontend
    restart: always
    ports:
      - "3007:80"
    depends_on:
      - backend
    networks:
      - cafe_net

volumes:
  cafe_postgres_data:
    driver: local

networks:
  cafe_net:
    driver: bridge
