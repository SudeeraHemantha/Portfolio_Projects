version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicareer_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicareer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VectorSecure123!}
      POSTGRES_DB: ${POSTGRES_DB:-aicareer_db}
    ports:
      - "5434:5432"
    volumes:
      - aicareer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicareer_admin} -d ${POSTGRES_DB:-aicareer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aicareer_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicareer_backend
    restart: always
    ports:
      - "8002:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicareer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VectorSecure123!}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aicareer_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicareer_net

volumes:
  aicareer_postgres_data:
    driver: local

networks:
  aicareer_net:
    driver: bridge
