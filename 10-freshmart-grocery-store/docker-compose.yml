version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: freshmart_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - freshmart_mongo_data:/data/db
    networks:
      - freshmart_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshmart_backend
    restart: always
    ports:
      - "5010:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/freshmart_db
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - freshmart_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshmart_frontend
    restart: always
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - freshmart_net

volumes:
  freshmart_mongo_data:
    driver: local

networks:
  freshmart_net:
    driver: bridge
