version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EnterprisePass123!}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

  agent-manager:
    build:
      context: ./services/agent-manager
      dockerfile: Dockerfile
    container_name: enterprise_agent_manager
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EnterprisePass123!}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - enterprise_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  enterprise_net:
    driver: bridge
